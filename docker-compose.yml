# Local development:   docker compose up -d db        (database only; run the app from the IDE / mvnw)
# Whole system:        docker compose up -d --build   (database + API in containers)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-stockflow}
      POSTGRES_USER: ${DB_USERNAME:-stockflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    # 127.0.0.1: reachable from this Mac only, not from other devices on the network.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - stockflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Runs the real production profile: everything comes from these variables.
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Inside the Compose network the database is "db" on its internal port 5432.
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-stockflow}
      DB_USERNAME: ${DB_USERNAME:-stockflow}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 32)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # This local stack serves plain http; a real deployment keeps the default (true) behind HTTPS.
      REFRESH_COOKIE_SECURE: "false"
      # Swagger is off in production by default; on here because this setup is for local use.
      API_DOCS_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  stockflow-db:
