name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is now outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Actions are pinned to commit SHAs (tags can be moved to point at other code).
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit, integration and concurrency tests. Integration tests start PostgreSQL with Testcontainers,
      # using the Docker engine that GitHub's Ubuntu runners provide.
      - name: Build and run all tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json pins (no silent upgrades).
      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Docker stack, smoke test, Playwright)
    # Only worth the ~5 minutes once the faster jobs are green; a red unit test is reported there.
    needs: [build, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Throwaway secrets, new for every run and masked in the log. Nothing is stored in GitHub Secrets,
      # so pull requests from forks can run this job too.
      - name: Create .env with random secrets
        run: |
          db_password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -base64 32)"
          admin_password="$(openssl rand -hex 24)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_password"
          cat > .env <<ENV
          DB_PASSWORD=$db_password
          JWT_SECRET=$jwt_secret
          ADMIN_EMAIL=admin@stockflow.local
          ADMIN_PASSWORD=$admin_password
          ENV

      # The same compose file a developer runs locally: database, API (prod profile) and nginx UI.
      # --wait returns once every service reports healthy, and fails if one never does.
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: API smoke test
        run: scripts/smoke-test.sh

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Only Chromium, the one browser the config tests; --with-deps adds the system libraries it needs.
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        working-directory: frontend
        run: npm run e2e

      # Hand the exact images that just passed every test to the publish job. They are saved by image ID
      # from the running containers, so what gets published is byte-for-byte what was tested.
      - name: Save the tested images (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          api="$(docker inspect --format '{{.Image}}' "$(docker compose ps -q app)")"
          web="$(docker inspect --format '{{.Image}}' "$(docker compose ps -q web)")"
          docker tag "$api" stockflow-api:tested
          docker tag "$web" stockflow-web:tested
          docker image save stockflow-api:tested stockflow-web:tested | gzip > tested-images.tar.gz
          printf 'api=%s\nweb=%s\n' "$api" "$web" > tested-image-ids.txt

      - name: Upload the tested images (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-images
          path: |
            tested-images.tar.gz
            tested-image-ids.txt
          retention-days: 1

      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      # Traces open in https://trace.playwright.dev or with `npx playwright show-trace`.
      - name: Upload test evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
            compose-logs.txt
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # The deploy gate: images reach the registry only from a commit on main whose every test passed, and only
  # the images the e2e job tested (no rebuild). This is the ONLY job that may write packages, and it runs no
  # project code (no npm, no Maven), so a compromised dependency in a test job cannot publish anything.
  publish:
    name: Publish the tested images (main only)
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      api_digest: ${{ steps.push.outputs.api_digest }}

    steps:
      - name: Download the tested images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-images

      - name: Load them and check they are unchanged
        run: |
          gunzip -c tested-images.tar.gz | docker image load
          . ./tested-image-ids.txt
          test "$(docker image inspect --format '{{.Id}}' stockflow-api:tested)" = "$api"
          test "$(docker image inspect --format '{{.Id}}' stockflow-web:tested)" = "$web"

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Tagged with the full commit SHA (immutable by convention) and "main" (moves). Deployments use the
      # digest from the summary, which can never point at different content.
      - name: Push, tagged with the commit SHA
        id: push
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "### Published images (commit \`$GITHUB_SHA\`)"
            echo "| Image | Digest to deploy |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for name in api web; do
            ref="ghcr.io/$owner/stockflow-$name"
            docker tag "stockflow-$name:tested" "$ref:$GITHUB_SHA"
            docker tag "stockflow-$name:tested" "$ref:main"
            docker push --quiet "$ref:$GITHUB_SHA"
            docker push --quiet "$ref:main"
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$ref:$GITHUB_SHA")"
            echo "| $name | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "${name}_digest=$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Log out
        if: always()
        run: docker logout ghcr.io

  # Deploys to Vercel what publish just pushed. A separate job so the deploy never holds packages: write or
  # the registry login, and it runs no project code here either: Vercel builds the UI on its own builders.
  # Skipped while VERCEL_TOKEN is not set (forks, or a repo without the hosting account).
  deploy:
    name: Deploy to Vercel (main only)
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      # Fails before deploying anything if a secret is missing or the token cannot see a project, and says
      # which. Prints only project names and HTTP codes, never the token.
      - name: Check Vercel access
        if: env.HAS_VERCEL_TOKEN == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          API_PROJECT: ${{ secrets.VERCEL_API_PROJECT_ID }}
          UI_PROJECT: ${{ secrets.VERCEL_UI_PROJECT_ID }}
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          for name in VERCEL_ORG_ID API_PROJECT UI_PROJECT API_HEALTH_URL; do
            test -n "${!name}" || { echo "::error::secret for $name is empty"; exit 1; }
          done
          auth=(-H "Authorization: Bearer $VERCEL_TOKEN")
          echo "Projects this token can see in the team:"
          curl -fsS "${auth[@]}" "https://api.vercel.com/v9/projects?teamId=$VERCEL_ORG_ID&limit=50" | jq -r '.projects[].name'
          failed=0
          code="$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" \
            "https://api.vercel.com/v9/projects/$API_PROJECT?teamId=$VERCEL_ORG_ID")"
          echo "API_PROJECT lookup (team): HTTP $code"
          [[ "$code" == 200 ]] || failed=1
          ui_code_team="$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" \
            "https://api.vercel.com/v9/projects/$UI_PROJECT?teamId=$VERCEL_ORG_ID")"
          echo "UI_PROJECT lookup (team): HTTP $ui_code_team"
          ui_lookup_scope=team
          if [[ "$ui_code_team" != 200 ]]; then
            ui_code_no_team="$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" \
              "https://api.vercel.com/v9/projects/$UI_PROJECT")"
            echo "UI_PROJECT lookup (no teamId): HTTP $ui_code_no_team"
            if [[ "$ui_code_no_team" == 200 ]]; then
              ui_lookup_scope=personal
            else
              failed=1
            fi
          fi
          echo "UI_VERCEL_SCOPE=$ui_lookup_scope" >> "$GITHUB_ENV"
          exit "$failed"

      # The API first, so the new UI never calls endpoints the running API does not have yet.
      # Vercel runs exactly the image the e2e job tested: the deployed Dockerfile is only a FROM line with the
      # digest publish pushed (never rebuilt from source, never a moving tag).
      - name: Deploy the API (tested image, by digest)
        if: env.HAS_VERCEL_TOKEN == 'true'
        env:
          API_DIGEST: ${{ needs.publish.outputs.api_digest }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$API_DIGEST"
          mkdir api-deploy
          echo "FROM $API_DIGEST" > api-deploy/Dockerfile
          echo '{"regions": ["fra1"]}' > api-deploy/vercel.json
          cd api-deploy
          npx --yes vercel@63.1.2 deploy --prod --yes --token "$VERCEL_TOKEN"

      # Java starts on the first request (about 20 s), so this also warms the new API up.
      - name: Wait for the API to be healthy
        if: env.HAS_VERCEL_TOKEN == 'true'
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 60 --output /dev/null "$API_HEALTH_URL"; then
              echo "API healthy after attempt $attempt"; exit 0
            fi
            sleep 10
          done
          echo "::error::API not healthy after 5 minutes"; exit 1

      - name: Check out (UI source for Vercel)
        if: env.HAS_VERCEL_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uploads frontend/ and Vercel builds it from this same commit with the locked dependencies (npm ci).
      # Known gap: that is a second build, not the nginx image the e2e job tested.
      - name: Deploy the UI
        if: env.HAS_VERCEL_TOKEN == 'true'
        working-directory: frontend
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_UI_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ "${UI_VERCEL_SCOPE:-team}" == personal ]]; then
            unset VERCEL_ORG_ID
          fi
          npx --yes vercel@63.1.2 deploy --prod --yes --token "$VERCEL_TOKEN"
