name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is now outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Actions are pinned to commit SHAs (tags can be moved to point at other code).
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit, integration and concurrency tests. Integration tests start PostgreSQL with Testcontainers,
      # using the Docker engine that GitHub's Ubuntu runners provide.
      - name: Build and run all tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json pins (no silent upgrades).
      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Docker stack, smoke test, Playwright)
    # Only worth the ~5 minutes once the faster jobs are green; a red unit test is reported there.
    needs: [build, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Throwaway secrets, new for every run and masked in the log. Nothing is stored in GitHub Secrets,
      # so pull requests from forks can run this job too.
      - name: Create .env with random secrets
        run: |
          db_password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -base64 32)"
          admin_password="$(openssl rand -hex 24)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_password"
          cat > .env <<ENV
          DB_PASSWORD=$db_password
          JWT_SECRET=$jwt_secret
          ADMIN_EMAIL=admin@stockflow.local
          ADMIN_PASSWORD=$admin_password
          ENV

      # The same compose file a developer runs locally: database, API (prod profile) and nginx UI.
      # --wait returns once every service reports healthy, and fails if one never does.
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: API smoke test
        run: scripts/smoke-test.sh

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Only Chromium, the one browser the config tests; --with-deps adds the system libraries it needs.
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        working-directory: frontend
        run: npm run e2e

      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      # Traces open in https://trace.playwright.dev or with `npx playwright show-trace`.
      - name: Upload test evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
            compose-logs.txt
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down -v
