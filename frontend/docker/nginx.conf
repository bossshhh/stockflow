# Serves the built UI and forwards /api to the Spring Boot container, so the browser sees ONE origin:
# no CORS, and the SameSite=Strict refresh cookie works exactly as in development.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # API: proxied to the backend service on the Compose network.
    location /api/ {
        proxy_pass http://app:8080;
        # $http_host keeps the port (localhost:3000). With plain $host Spring saw "localhost", decided the
        # page (Origin localhost:3000) was another site, applied CORS and answered 403.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Built assets have content hashes in their names: cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the single-page app: unknown paths get index.html (the router handles them).
    # index.html is never cached, so a new release is picked up on the next visit.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
