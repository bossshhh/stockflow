# Included in every location that serves the UI. (nginx gotcha: an add_header inside a location
# silently drops all add_header lines from the server block, so the headers live in one snippet.)
#
# CSP: scripts only from our own origin (no inline scripts, no eval), API calls only to our origin,
# no framing. font-src allows data: because Vite inlines small font subsets (fonts cannot run code).
# style-src needs 'unsafe-inline' because the component and chart libraries set style
# attributes; scripts, the real XSS risk, stay strict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
