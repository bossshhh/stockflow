# Production: everything comes from the environment, with no defaults to fall back on.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

stockflow:
  security:
    cors:
      # No localhost default in production: the real UI origin must be configured.
      allowed-origins: ${CORS_ALLOWED_ORIGINS}

# API docs are a map of every endpoint: off in production unless explicitly enabled.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
