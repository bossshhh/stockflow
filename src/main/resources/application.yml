# Settings shared by every profile. Connection details live in the profile files.
spring:
  application:
    name: stockflow
  profiles:
    default: dev
  datasource:
    hikari:
      # Postgres handles a small pool best; most requests are short transactions.
      # Raise it only after load testing shows threads waiting for connections.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
      # Every statement waits at most this long for a row or table lock, then fails (mapped to 409
      # CONCURRENT_UPDATE). Without it, one stuck transaction makes every request behind it wait forever,
      # each holding a pooled connection, until the whole API stops. Set per connection, so it covers every
      # query, including Flyway migrations (which then fail fast instead of blocking all traffic).
      connection-init-sql: SET lock_timeout = '${DB_LOCK_TIMEOUT:3s}'
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # Caps ?size= so one request cannot pull the whole table.
        max-page-size: 100
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        # On shutdown, let a running housekeeping job finish its current order instead of cutting it off.
        await-termination: true
        await-termination-period: 30s
  jackson:
    # Strict request contract (QA findings): reject 1.5 for an integer field instead of silently
    # truncating it to 1, and reject numbers sent as strings ("12.50") instead of converting them.
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

springdoc:
  paths-to-match: /api/**
  # Responses are JSON; without this the spec says "*/*" and generated clients cannot type them.
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

stockflow:
  orders:
    # A CONFIRMED order can be cancelled while now <= confirmedAt + this window (inclusive).
    confirmed-cancel-window: ${ORDER_CANCEL_WINDOW:5m}
    # A retried order with the same Idempotency-Key returns the first order while now <= createdAt + this.
    idempotency-key-ttl: ${ORDER_IDEMPOTENCY_KEY_TTL:24h}
    # A PENDING order nobody confirmed within this is cancelled by the system and its stock released
    # (business rule, decided 2026-10-23). 48h survives a weekend; a public demo would use e.g. 1h.
    pending-expiry: ${ORDER_PENDING_EXPIRY:48h}
  # Scheduled jobs: expire stale orders, delete expired refresh tokens and idempotency keys. Safe to run
  # on several instances at once (see OrderHousekeeping), so no distributed lock.
  housekeeping:
    enabled: ${HOUSEKEEPING_ENABLED:true}
    initial-delay: PT1M
    order-expiry-interval: PT5M
    cleanup-interval: PT1H
  security:
    jwt:
      # Base64 of at least 32 random bytes (HS256). No default on purpose: the app refuses to start without it.
      secret: ${JWT_SECRET}
      ttl: ${JWT_TTL:15m}
      issuer: stockflow
      # Revocation (disable, sign out everywhere) is checked on every request through a short cache.
      # This instance sees a revocation at once; other instances within this time.
      revocation-cache-ttl: ${JWT_REVOCATION_CACHE_TTL:10s}
    refresh:
      ttl: ${REFRESH_TTL:7d}
      # HTTPS-only cookie. Set REFRESH_COOKIE_SECURE=false only for local plain-http setups.
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    # BCrypt cost: each +1 doubles hashing time. 12 is about 250 ms per hash, which slows brute force.
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    # Only FAILED logins count (a successful one gives its attempt back). Hitting a limit gives 429 with
    # Retry-After. Kept in memory: correct for a single instance (see AuthRateLimiter).
    rate-limit:
      failed-logins-per-email:
        attempts: ${LOGIN_FAILURES_PER_EMAIL:5}
        per: 15m
      failed-logins-per-ip:
        attempts: ${LOGIN_FAILURES_PER_IP:20}
        per: 10m
      registrations-per-ip:
        attempts: ${REGISTRATIONS_PER_IP:10}
        per: 1h
    # Optional: creates this ADMIN at startup if no user has the email yet.
    bootstrap-admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  # Behind a reverse proxy (nginx here, a load balancer in the cloud): Tomcat takes the client IP and the
  # original scheme (https) from X-Forwarded-For / X-Forwarded-Proto, but ONLY from trusted proxies
  # (private-network addresses by default; set SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES in a deployment).
  # Needed for per-IP rate limits and for knowing a request came in over HTTPS.
  forward-headers-strategy: native
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
