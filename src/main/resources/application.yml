# Settings shared by every profile. Connection details live in the profile files.
spring:
  application:
    name: stockflow
  profiles:
    default: dev
  datasource:
    hikari:
      # Postgres handles a small pool best; most requests are short transactions.
      # Raise it only after load testing shows threads waiting for connections.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # Caps ?size= so one request cannot pull the whole table.
        max-page-size: 100
  lifecycle:
    timeout-per-shutdown-phase: 30s

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

stockflow:
  orders:
    # A CONFIRMED order can be cancelled while now <= confirmedAt + this window (inclusive).
    confirmed-cancel-window: ${ORDER_CANCEL_WINDOW:5m}
  security:
    jwt:
      # Base64 of at least 32 random bytes (HS256). No default on purpose: the app refuses to start without it.
      secret: ${JWT_SECRET}
      ttl: ${JWT_TTL:15m}
      issuer: stockflow
    # BCrypt cost: each +1 doubles hashing time. 12 is about 250 ms per hash, which slows brute force.
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    # Optional: creates this ADMIN at startup if no user has the email yet.
    bootstrap-admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
